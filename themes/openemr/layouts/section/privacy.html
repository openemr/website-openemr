{{ define "main"}}
<div style="margin-top: 98px; margin-bottom: 50px">
  <div class="container page">
    <div class="row">
      <div class="col-xs-12 col-md-8 offset-md-2 privacy-policy">
        <h1>{{ .Title }}</h1>
        <p class="text-muted">Last updated: <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2, 2006" }}</time></p>
        {{ .Content }}
      </div>
    </div>
  </div>
</div>
{{ end}}
