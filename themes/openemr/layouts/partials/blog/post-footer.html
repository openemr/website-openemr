<div class="row justify-content-center">
    <footer class="post-footer">
        {{ if .Params.tags }}
        <p class="post-tags">
            <span>Tagged:</span>
            {{ $len := len .Params.tags }} {{ range $index, $tag := .Params.tags }}
            <a href="{{ " /tags/ " | relLangURL }}{{ . | urlize }}/" class="badge badge-primary">{{ . }}</a>
            {{ end }}
        </p>
        {{ end}}
    </footer>
</div>
